<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Red Pen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23D42A3C' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Kalam:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <form class="login" method="post" action="/api/login">
    <div class="brand">
      <span class="wordmark">Red Pen</span>
      <svg class="wordmark-underline" viewBox="0 0 120 10" aria-hidden="true"><path d="M2 7 C 30 2, 70 2, 118 6"/></svg>
    </div>
    <label class="field">
      <span class="label">Staff password</span>
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <p class="form-error" id="wrong" role="alert" hidden>That password didn't match. Try again.</p>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <script>if (location.search.includes("wrong")) document.getElementById("wrong").hidden = false;</script>
</body>
</html>
